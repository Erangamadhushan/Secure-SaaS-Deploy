version: "3.9"

services:
  backend:
    build: 
      context: https://github.com/Erangamadhushan/Secure-SaaS-API.git

    container_name: secure_saas_api
    env_file:
      - backend.env
    expose:
      - "5000"

  frontend:
    build:
      context: https://github.com/Erangamadhushan/SaaS-API-Front-end.git

    container_name: saas_api_frontend


  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend
      - frontend
